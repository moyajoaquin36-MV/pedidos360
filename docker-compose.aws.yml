# Despliegue en EC2: MySQL + 2 microservicios + nginx (frontend estatico).
# Variables (en .env junto a este archivo): DB_PASSWORD, AZURE_TENANT_ID,
# AZURE_CLIENT_ID, CORS_ORIGINS
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: pedidos360
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro

  ms-pedidos:
    build: ./ms-pedidos
    restart: unless-stopped
    depends_on: [mysql]
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_NAME: ms_pedidos_db
      DB_USERNAME: pedidos360
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      APP_PRODUCTOS_BASE_URL: http://ms-productos:8080
    ports:
      - "8081:8080"

  ms-productos:
    build: ./ms-productos
    restart: unless-stopped
    depends_on: [mysql]
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_NAME: ms_productos_db
      DB_USERNAME: pedidos360
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8082:8080"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  mysql-data:
