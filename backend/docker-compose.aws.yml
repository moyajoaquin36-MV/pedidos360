# Despliegue en EC2: MySQL + cluster RabbitMQ (2 nodos) + 6 microservicios + nginx
# (ms-pedidos, ms-productos, ms-rabbit-admin, ms-kafka-admin, ms-reportes, ms-auditoria).
# El cluster Kafka (3 Zookeeper + 3 brokers + Kafka UI) esta en docker-compose.kafka.yml
# y se levanta junto con este archivo (ms-kafka-admin, ms-reportes y ms-auditoria dependen de el):
#   docker compose -f docker-compose.aws.yml -f docker-compose.kafka.yml --env-file .env up -d --build
# JAVA_TOOL_OPTIONS limita el heap de cada microservicio (todo el stack comparte 8 GB de RAM).
# Variables (en .env junto a este archivo): DB_PASSWORD, AZURE_TENANT_ID,
# AZURE_CLIENT_ID, CORS_ORIGINS, RABBITMQ_USER, RABBITMQ_PASSWORD, RABBITMQ_ERLANG_COOKIE
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: pedidos360
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro

  # Cluster RabbitMQ de 2 nodos (guia 2.3.1): mismo Erlang cookie y el mismo
  # rabbitmq.conf con la lista de nodos. rabbitmq-2 se une a rabbitmq-1.
  rabbitmq-1:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "15672:15672"    # Management UI nodo 1
    healthcheck: &rabbitmq-health
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  rabbitmq-2:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}  # MISMO COOKIE
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "15673:15672"    # Management UI nodo 2
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    healthcheck: *rabbitmq-health

  ms-pedidos:
    build: ./ms-pedidos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      DB_HOST: mysql
      DB_NAME: ms_pedidos_db
      DB_USERNAME: pedidos360
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      APP_PRODUCTOS_BASE_URL: http://ms-productos:8080
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Sin depends_on hacia Kafka: si Kafka esta caido el pedido igual se crea (solo se registra).
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
    ports:
      - "8081:8080"

  ms-productos:
    build: ./ms-productos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      DB_HOST: mysql
      DB_NAME: ms_productos_db
      DB_USERNAME: pedidos360
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Sin depends_on hacia Kafka: si Kafka esta caido el stock igual se actualiza (solo se registra).
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
    ports:
      - "8082:8080"

  ms-rabbit-admin:
    build: ./ms-rabbit-admin
    restart: unless-stopped
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8083:8080"

  # Microservicios de Kafka (brokers en docker-compose.kafka.yml): esperan a los 3 brokers sanos.
  # ms-kafka-admin: control plane de topicos y consumer groups (solo ADMIN_GENERAL).
  ms-kafka-admin:
    build: ./ms-kafka-admin
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
    ports:
      - "8084:8080"

  # ms-reportes: consumer group grupo-reporteria (metricas en tiempo real, en memoria).
  ms-reportes:
    build: ./ms-reportes
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
    ports:
      - "8085:8080"

  # ms-auditoria: consumer group grupo-auditoria (guarda cada evento en ms_auditoria_db).
  ms-auditoria:
    build: ./ms-auditoria
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      DB_HOST: mysql
      DB_NAME: ms_auditoria_db
      DB_USERNAME: pedidos360
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
    ports:
      - "8086:8080"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  mysql-data:
  rabbitmq_data_1:
  rabbitmq_data_2:
