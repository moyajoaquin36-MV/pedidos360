# Despliegue en EC2: MySQL + cluster RabbitMQ (2 nodos) + 3 microservicios + nginx.
# Variables (en .env junto a este archivo): DB_PASSWORD, AZURE_TENANT_ID,
# AZURE_CLIENT_ID, CORS_ORIGINS, RABBITMQ_USER, RABBITMQ_PASSWORD, RABBITMQ_ERLANG_COOKIE
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: pedidos360
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro

  # Cluster RabbitMQ: mismo Erlang cookie en ambos nodos y cluster.conf con la lista de nodos.
  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    restart: unless-stopped
    environment: &rabbitmq-env
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./deploy/rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbitmq1-data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    healthcheck: &rabbitmq-health
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq2
    restart: unless-stopped
    depends_on:
      rabbitmq1:
        condition: service_healthy
    environment: *rabbitmq-env
    volumes:
      - ./deploy/rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbitmq2-data:/var/lib/rabbitmq
    ports:
      - "15673:15672"
    healthcheck: *rabbitmq-health

  ms-pedidos:
    build: ./ms-pedidos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_NAME: ms_pedidos_db
      DB_USERNAME: pedidos360
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      APP_PRODUCTOS_BASE_URL: http://ms-productos:8080
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8081:8080"

  ms-productos:
    build: ./ms-productos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_NAME: ms_productos_db
      DB_USERNAME: pedidos360
      DB_PASSWORD: ${DB_PASSWORD}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8082:8080"

  ms-rabbit-admin:
    build: ./ms-rabbit-admin
    restart: unless-stopped
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8083:8080"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  mysql-data:
  rabbitmq1-data:
  rabbitmq2-data:
