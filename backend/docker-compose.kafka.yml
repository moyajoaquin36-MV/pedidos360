# Cluster Kafka (guia 3.2.1 ampliada a 3 Zookeeper + 3 brokers) + Kafka UI.
# Se levanta JUNTO con docker-compose.aws.yml para quedar en la misma red del proyecto:
#   docker compose -f docker-compose.aws.yml -f docker-compose.kafka.yml --env-file .env up -d
# Los topicos se crean explicitamente con deploy/kafka-topicos.sh (auto-creacion apagada).
#
# Puertos: Zookeeper no se publica. Los brokers se publican SOLO en 127.0.0.1 para usar
# la CLI desde la propia EC2: Kafka no tiene autenticacion y Docker se salta el firewall
# del host, asi que publicarlo en 0.0.0.0 lo dejaria abierto a internet. Los
# microservicios usan los listeners internos kafka-1:29092, kafka-2:29093, kafka-3:29094.

# Comun a los 3 Zookeeper: ensamble de 3 nodos. El quorum es la mayoria (2 de 3),
# por lo que el ensamble sigue funcionando si cae 1 nodo.
x-zookeeper-comun: &zookeeper-comun
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
  KAFKA_HEAP_OPTS: "-Xmx128M -Xms128M"

# Comun a los 3 brokers: cada particion tiene 3 replicas (RF 3) y un productor con
# acks=all necesita 2 replicas sincronizadas (min.insync 2) => se tolera la caida de
# 1 broker sin perder datos ni dejar de escribir. Los topicos se crean a mano (nunca
# quedan con 1 particion por auto-creacion).
x-kafka-comun: &kafka-comun
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
  KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 33554432

services:
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper-1
    hostname: zookeeper-1
    restart: unless-stopped
    environment:
      <<: *zookeeper-comun
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper_data_1:/var/lib/zookeeper/data
      - zookeeper_log_1:/var/lib/zookeeper/log

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper-2
    hostname: zookeeper-2
    restart: unless-stopped
    environment:
      <<: *zookeeper-comun
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper_data_2:/var/lib/zookeeper/data
      - zookeeper_log_2:/var/lib/zookeeper/log

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper-3
    hostname: zookeeper-3
    restart: unless-stopped
    environment:
      <<: *zookeeper-comun
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper_data_3:/var/lib/zookeeper/data
      - zookeeper_log_3:/var/lib/zookeeper/log

  # Cada broker: listener interno PLAINTEXT (red de Docker) y PLAINTEXT_HOST (CLI en la EC2).
  # Healthcheck liviano: solo revisa que el listener interno acepte conexiones (sin levantar otra JVM).
  kafka-1:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-1
    hostname: kafka-1
    restart: unless-stopped
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      <<: *kafka-comun
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/29092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-2:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-2
    hostname: kafka-2
    restart: unless-stopped
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      <<: *kafka-comun
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/29093"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-3:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-3
    hostname: kafka-3
    restart: unless-stopped
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      <<: *kafka-comun
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/29094"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Consola web del cluster (topicos, particiones, mensajes, consumer groups y LAG).
  # No tiene login: en el Security Group abrir el 8080 solo a la IP de quien administra.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      JAVA_OPTS: "-Xmx256m -Xms256m"

volumes:
  zookeeper_data_1:
  zookeeper_log_1:
  zookeeper_data_2:
  zookeeper_log_2:
  zookeeper_data_3:
  zookeeper_log_3:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
