spring:
  datasource:
    url: jdbc:h2:mem:pedidos360;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  # Los tests no levantan RabbitMQ: los listeners no se inician.
  rabbitmq:
    listener:
      simple:
        auto-startup: false

azure:
  ad:
    tenant-id: common
    client-id: test-client-id

# Nombres de exchanges, colas y routing keys (ver mensajeria/config/RabbitConfig).
mensajeria:
  exchanges:
    direct: pedidos360.direct
    topic: pedidos360.topic
  colas:
    tickets: pedidos.tickets
    notificaciones: notificaciones.pedidos
  routing-keys:
    pedido-creado: pedido.creado
    estado-pedido: pedido.estado
    estado-pedido-binding: pedido.estado.*
  # Cada cola: <cola>.dlx (fanout) -> <cola>.dlq, que guarda los mensajes muertos 24 h.
  dead-letter:
    sufijo-dlx: .dlx
    sufijo-dlq: .dlq
    ttl-dlq-ms: 86400000
