server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-pedidos
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ms_pedidos_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:pedidos360}
    password: ${DB_PASSWORD:pedidos360}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  # Cluster de 2 nodos: si uno cae, el cliente se conecta al otro.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10

# Nombres de exchanges, colas y routing keys (ver mensajeria/config/RabbitConfig).
mensajeria:
  exchanges:
    direct: pedidos360.direct
    topic: pedidos360.topic
    dead-letter: pedidos360.dlx
  colas:
    tickets: pedidos.tickets
    notificaciones: notificaciones.pedidos
  routing-keys:
    pedido-creado: pedido.creado
    estado-pedido: pedido.estado
    estado-pedido-binding: pedido.estado.*
  sufijo-dlq: .dlq

# Datos del tenant de Azure AD (Entra ID). Reemplazar por los valores reales
# una vez creado el tenant (ver guia "Creacion de tenant") y registrada la app.
azure:
  ad:
    tenant-id: ${AZURE_TENANT_ID:00000000-0000-0000-0000-000000000000}
    client-id: ${AZURE_CLIENT_ID:00000000-0000-0000-0000-000000000000}

logging:
  level:
    org.springframework.security: INFO
