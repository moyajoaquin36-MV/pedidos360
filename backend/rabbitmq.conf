# Archivo: ./rabbitmq.conf (junto a docker-compose.aws.yml), montado en ambos nodos.
# Clustering automatico: cada nodo busca a los demas en esta lista y se une al
# que ya este corriendo. Ambos comparten el mismo RABBITMQ_ERLANG_COOKIE.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Tiempo de espera para que los nodos se descubran
cluster_formation.node_cleanup.interval = 10000
