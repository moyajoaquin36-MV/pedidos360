server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # index.html nunca se cachea: asi el navegador siempre toma el build nuevo.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Los .js/.css llevan hash en el nombre: se pueden cachear sin riesgo.
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
