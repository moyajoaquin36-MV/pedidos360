spring:
  datasource:
    url: jdbc:h2:mem:pedidos360productos;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  # Los tests no levantan RabbitMQ: los listeners no se inician.
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  # Los tests no levantan Kafka: no se crean topicos al arrancar (el productor
  # solo se conecta al primer envio, y en los tests los publishers van mockeados).
  kafka:
    admin:
      auto-create: false
      fail-fast: false

azure:
  ad:
    tenant-id: common
    client-id: test-client-id

# Nombres de exchanges, colas y routing keys (ver mensajeria/config/RabbitConfig).
mensajeria:
  exchanges:
    topic: pedidos360.topic
  colas:
    alertas-stock: inventario.alertas
  routing-keys:
    stock-bajo: producto.stock.bajo
    stock-binding: producto.stock.*
  # Cada cola: <cola>.dlx (fanout) -> <cola>.dlq, que guarda los mensajes muertos 24 h.
  dead-letter:
    sufijo-dlx: .dlx
    sufijo-dlq: .dlq
    ttl-dlq-ms: 86400000
  # Con stock igual o menor a esto se publica una alerta.
  umbral-stock-bajo: 5

# Topico Kafka que produce ms-productos (ver mensajeria/kafka/config/KafkaConfig).
kafka:
  topicos:
    inventario-movimientos:
      nombre: inventario-movimientos
      particiones: 3
      replicas: 3
      configs:
        cleanup.policy: compact
        min.insync.replicas: 2
