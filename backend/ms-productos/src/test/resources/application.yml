spring:
  datasource:
    url: jdbc:h2:mem:pedidos360productos;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  # Los tests no levantan RabbitMQ: los listeners no se inician.
  rabbitmq:
    listener:
      simple:
        auto-startup: false

azure:
  ad:
    tenant-id: common
    client-id: test-client-id

# Nombres de exchanges, colas y routing keys (ver mensajeria/config/RabbitConfig).
mensajeria:
  exchanges:
    topic: pedidos360.topic
    dead-letter: pedidos360.dlx
  colas:
    alertas-stock: inventario.alertas
  routing-keys:
    stock-bajo: producto.stock.bajo
    stock-binding: producto.stock.*
  sufijo-dlq: .dlq
  # Con stock igual o menor a esto se publica una alerta.
  umbral-stock-bajo: 5
