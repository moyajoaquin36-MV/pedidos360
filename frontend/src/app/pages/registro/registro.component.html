<section class="login">
  <h1>Crea tu cuenta en Pedidos 360</h1>
  <p>
    Registrate con tu correo para comprar en cualquiera de los 20 locales de la red.
    Te llegara un codigo de verificacion al correo y listo: tu cuenta queda creada
    y entras directamente a la tienda.
  </p>
  <button type="button" (click)="crearCuenta()">Crear mi cuenta</button>
  <p class="login-alterno">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesion</a>
  </p>
</section>
